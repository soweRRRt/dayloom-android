name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (must match app versionName)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DAYLOOM_KEYSTORE_PASSWORD: ${{ secrets.DAYLOOM_KEYSTORE_PASSWORD }}
      DAYLOOM_KEY_ALIAS: ${{ secrets.DAYLOOM_KEY_ALIAS }}
      DAYLOOM_KEY_PASSWORD: ${{ secrets.DAYLOOM_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.DAYLOOM_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Validate release version and detect signing
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested_version="${INPUT_VERSION}"
          else
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${requested_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use X.Y.Z SemVer format." >&2
            exit 1
          fi
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ -z "${version_name}" || "${requested_version}" != "${version_name}" ]]; then
            echo "Release version ${requested_version} does not match app versionName ${version_name:-<missing>}." >&2
            exit 1
          fi
          signed=true
          for value in KEYSTORE_BASE64 DAYLOOM_KEYSTORE_PASSWORD DAYLOOM_KEY_ALIAS DAYLOOM_KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then signed=false; fi
          done
          echo "tag=v${requested_version}" >> "${GITHUB_OUTPUT}"
          echo "signed=${signed}" >> "${GITHUB_OUTPUT}"

      - name: Restore release keystore
        if: steps.release_meta.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/dayloom-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "DAYLOOM_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Verify and build signed release
        if: steps.release_meta.outputs.signed == 'true'
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Confirm APK signature
        if: steps.release_meta.outputs.signed == 'true'
        shell: bash
        run: "${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"

      - name: Publish GitHub release
        if: steps.release_meta.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          gh release create "${tag}" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "${GITHUB_SHA}" \
            --title "Dayloom ${tag}" \
            --generate-notes \
            --verify-tag=false

      - name: Verify and build unsigned preview
        if: steps.release_meta.outputs.signed != 'true'
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug assembleDebug bundleRelease

      - name: Prepare clearly labeled preview artifacts
        if: steps.release_meta.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dayloom-${tag}-debug-test-only.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dayloom-${tag}-unsigned.aab"
          cat > preview-notes.md <<'EOF'
          ## Preview build

          Production signing secrets are not configured yet, so this first release is marked as a prerelease.

          This build includes the local habit tracker, unified habit/plan calendar, flexible lists, wishlist savings goals, encrypted password Vault, reminders, customizable navigation and dashboard, RU/EN interface, example content, and portable data backup/restore.

          - `debug-test-only.apk` is installable for testing but must not be distributed as a production build.
          - `unsigned.aab` is provided for build verification only and cannot be uploaded to Google Play as-is.
          - Password Vault data is never included in exported Dayloom backups because its key stays in Android Keystore.
          EOF

      - name: Publish unsigned preview release
        if: steps.release_meta.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          gh release create "${tag}" \
            "dayloom-${tag}-debug-test-only.apk" \
            "dayloom-${tag}-unsigned.aab" \
            --target "${GITHUB_SHA}" \
            --title "Dayloom ${tag} Preview" \
            --notes-file preview-notes.md \
            --prerelease \
            --verify-tag=false
