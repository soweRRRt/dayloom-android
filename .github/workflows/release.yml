name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (must match app versionName)"
        required: true
        default: "0.3.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish signed artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DAYLOOM_KEYSTORE_PASSWORD: ${{ secrets.DAYLOOM_KEYSTORE_PASSWORD }}
      DAYLOOM_KEY_ALIAS: ${{ secrets.DAYLOOM_KEY_ALIAS }}
      DAYLOOM_KEY_PASSWORD: ${{ secrets.DAYLOOM_KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.DAYLOOM_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release version and signing secrets
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            requested_version="${INPUT_VERSION}"
          else
            requested_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${requested_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use X.Y.Z SemVer format." >&2
            exit 1
          fi
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ -z "${version_name}" || "${requested_version}" != "${version_name}" ]]; then
            echo "Release version ${requested_version} does not match app versionName ${version_name:-<missing>}." >&2
            exit 1
          fi
          for value in KEYSTORE_BASE64 DAYLOOM_KEYSTORE_PASSWORD DAYLOOM_KEY_ALIAS DAYLOOM_KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required release secret ${value} is not configured." >&2
              exit 1
            fi
          done
          echo "tag=v${requested_version}" >> "${GITHUB_OUTPUT}"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/dayloom-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "DAYLOOM_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Verify and build signed release
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug validateDebugScreenshotTest assembleRelease bundleRelease

      - name: Confirm APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Prepare versioned artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dayloom-${tag}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/dayloom-${tag}.aab"
          (
            cd dist
            sha256sum "dayloom-${tag}.apk" "dayloom-${tag}.aab" > SHA256SUMS.txt
          )

      - name: Upload signed workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dayloom-${{ steps.release_meta.outputs.tag }}-signed
          path: |
            dist/dayloom-${{ steps.release_meta.outputs.tag }}.apk
            dist/dayloom-${{ steps.release_meta.outputs.tag }}.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          gh release create "${tag}" \
            "dist/dayloom-${tag}.apk" \
            "dist/dayloom-${tag}.aab" \
            dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Dayloom ${tag}" \
            --generate-notes \
            --latest
